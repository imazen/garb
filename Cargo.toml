[package]
name = "garb"
version = "0.3.0"
edition = "2024"
rust-version = "1.89"
authors = ["Lilith River <lilith@imazen.io>"]
description = "Dress your pixels for the occasion — SIMD-optimized integer pixel format conversions"
license = "MIT OR Apache-2.0"
keywords = ["pixel", "swizzle", "bgra", "rgba", "simd"]
categories = ["graphics", "multimedia::images", "no-std"]
repository = "https://github.com/imazen/garb"
readme = "README.crates.md"
exclude = [
    ".github/",
    ".gitignore",
    ".zenbench/",
    "AGENTS.md",
    "CLAUDE.md",
    "README.md",
    "apidoc/",
    "benchmarks/",
    "tests/",
    "docs/",
    "justfile",
]

[dependencies]
archmage = { version = "0.9.31", default-features = false, features = ["macros"] }
paste = { package = "pastey", version = "0.2.3" }
bytemuck = { version = "1.25.2", default-features = false, optional = true }
rgb = { version = "0.8.53", features = ["bytemuck"], optional = true }
imgref = { version = "1.12.3", optional = true }

[dev-dependencies]
archmage = { version = "0.9.31", default-features = false, features = ["std", "testable_dispatch"] }
rgb = { version = "0.8.53", features = ["bytemuck"] }
imgref = "1.12.3"
criterion = { version = "0.8.2", default-features = false, features = ["plotters", "html_reports"] }
zenbench = "0.1.11"

[[bench]]
name = "swizzle"
harness = false

[features]
default = ["std"]
std = ["archmage/std"]
experimental = []
rgb = ["dep:rgb", "dep:bytemuck"]
imgref = ["dep:imgref", "rgb", "bytemuck/extern_crate_alloc"]

[[bench]]
name = "kernel_tiers"
harness = false

[[example]]
name = "precision_policies"
