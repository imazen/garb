[package]
name = "garb"
version = "0.2.8"
edition = "2024"
rust-version = "1.89"
authors = ["Lilith River <lilith@imazen.io>"]
description = "Dress your pixels for the occasion — SIMD-optimized pixel format conversions"
license = "MIT OR Apache-2.0"
keywords = ["pixel", "swizzle", "bgra", "rgba", "simd"]
categories = ["graphics", "multimedia::images", "no-std"]
repository = "https://github.com/imazen/garb"
readme = "README.crates.md"
exclude = [
    ".github/",
    ".gitignore",
    "benchmarks/",
    "tests/",
    "docs/",
    "justfile",
]

[dependencies]
archmage = { version = "0.9.21", features = ["macros"] }
bytemuck = { version = "1.25.2", features = ["derive", "extern_crate_alloc"] }
paste = { version = "1.0.15", optional = true }
rgb = { version = "0.8.53", features = ["bytemuck"], optional = true }
imgref = { version = "1.12.3", optional = true }

[dev-dependencies]
archmage = { version = "0.9.21", features = ["testable_dispatch"] }
rgb = { version = "0.8.53", features = ["bytemuck"] }
imgref = "1.12.3"
criterion = { version = "0.8.2", default-features = false, features = ["plotters", "html_reports"] }
zenbench = "0.1.7"

[[bench]]
name = "swizzle"
harness = false

[[bench]]
name = "deinterleave"
harness = false
required-features = ["experimental"]

[features]
default = ["std"]
std = ["archmage/std"]
experimental = ["dep:paste"]
rgb = ["dep:rgb"]
imgref = ["dep:imgref", "rgb"]

[[bench]]
name = "kernel_tiers"
harness = false
