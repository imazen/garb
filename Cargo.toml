[package]
name = "garb"
version = "0.2.9"
edition = "2024"
rust-version = "1.89"
authors = ["Lilith River <lilith@imazen.io>"]
description = "Dress your pixels for the occasion — SIMD-optimized pixel format conversions"
license = "MIT OR Apache-2.0"
keywords = ["pixel", "swizzle", "bgra", "rgba", "simd"]
categories = ["graphics", "multimedia::images", "no-std"]
repository = "https://github.com/imazen/garb"
readme = "README.crates.md"
exclude = [
    ".github/",
    ".gitignore",
    ".zenbench/",
    "AGENTS.md",
    "CLAUDE.md",
    "README.md",
    "apidoc/",
    "benchmarks/",
    "tests/",
    "docs/",
    "justfile",
]

[dependencies]
archmage = { version = "0.9.32", git = "https://github.com/imazen/archmage", rev = "303341570757936368fca1ee7254a19075cbff08", default-features = false, features = ["macros"] }
magetypes = { version = "0.9.32", git = "https://github.com/imazen/archmage", rev = "303341570757936368fca1ee7254a19075cbff08", default-features = false, optional = true }
bytemuck = { version = "1.25.2", features = ["derive", "extern_crate_alloc"], optional = true }
paste = { package = "pastey", version = "0.2.3", optional = true }
rgb = { version = "0.8.53", features = ["bytemuck"], optional = true }
imgref = { version = "1.12.3", optional = true }

[target.'cfg(any(all(target_arch = "x86_64", target_feature = "sse2"), target_arch = "aarch64", target_arch = "wasm32"))'.dependencies]
bytemuck = { version = "1.25.2", features = ["derive", "extern_crate_alloc"] }

[dev-dependencies]
archmage = { version = "0.9.32", git = "https://github.com/imazen/archmage", rev = "303341570757936368fca1ee7254a19075cbff08", default-features = false, features = ["std", "testable_dispatch"] }
rgb = { version = "0.8.53", features = ["bytemuck"] }
imgref = "1.12.3"
criterion = { version = "0.8.2", default-features = false, features = ["plotters", "html_reports"] }
zenbench = "0.1.11"

[[bench]]
name = "swizzle"
harness = false

[[bench]]
name = "deinterleave"
harness = false
required-features = ["experimental"]

[features]
default = ["std"]
std = ["archmage/std", "magetypes?/std"]
experimental = ["dep:paste", "dep:magetypes"]
rgb = ["dep:rgb", "dep:bytemuck"]
imgref = ["dep:imgref", "rgb"]

[[bench]]
name = "kernel_tiers"
harness = false

[[example]]
name = "precision_policies"
required-features = ["experimental"]

# Use the reviewed SIMD stack until 0.9.32 ships on crates.io.
[patch.crates-io]
archmage = { git = "https://github.com/imazen/archmage", rev = "303341570757936368fca1ee7254a19075cbff08" }
magetypes = { git = "https://github.com/imazen/archmage", rev = "303341570757936368fca1ee7254a19075cbff08" }
